<div class="row">

    <div class="col-lg-6">
        <section class="widget">
            <header style="background-color: #555555">
                <h4 style="color: white;">
                    <strong>Tipos de gastos</strong>
                </h4>
            </header>

            <div class="widget-body">
                <form #CForm="ngForm">
                    <fieldset>
                        <legend></legend>

                        <div class="col-lg-12">
                            <app-add-tipo-gasto (addTipoGasto)="reload()"></app-add-tipo-gasto>
                        </div>
                    </fieldset>
                </form>
            </div>
        </section>
    </div>
    <div class="col-lg-6">
        <section class="widget">
            <header style="background-color: #555555">
                <h4 style="color: white;">
                    <strong>Sub gastos</strong>
                </h4>
            </header>

            <div class="widget-body">
                <form #CSubForm="ngForm">
                    <fieldset>
                        <legend></legend>

                        <div class="col-lg-12">
                            <app-add-sub-tipo-gasto (addSubTipoGasto)="reload()"></app-add-sub-tipo-gasto>
                        </div>
                    </fieldset>
                </form>
            </div>
        </section>
    </div>
</div>

<app-list-tipos-gasto (updTipoGasto)="reloadSubTipo()"></app-list-tipos-gasto>
