<div class="row">
    <div class="col-lg-12">
        <div class="margin05">


            <div class="row">
                <div class="col-lg-12">
                    <section class="widget MaxProveedor">
                        <header style="background-color: #555555">
                            <h4 style="color: white;">
                                <strong>Cargar cotización</strong>
                            </h4>
                        </header>
                        <div class="widget-body">
                            <form #CForm="ngForm">


                                <fieldset>
                                    <legend></legend>

                                    <div class="row labelHeder">
                                        <div class="col-6">
                                            Prioridad
                                        </div>

                                        <div class="col-6">
                                            Adjunto
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-6">
                                            <select id="drdPrioridad"
                                                class="dropdown-toggle select2-chosen-2 form-control requiered"
                                                [(ngModel)]="cotizacion.prioridad" name="drdPrioridad">
                                                <option value=0 selected>--- Seleccione una opcion ---
                                                </option>
                                                <option value=1>Baja</option>
                                                <option value=2>Media</option>
                                                <option value=3>Alta</option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <div class="fileinput fileinput-new input-group" data-provides="fileinput">
                                                <div class="form-control" data-trigger="fileinput">
                                                    <i class="glyphicon glyphicon-file fileinput-exists"></i>
                                                    <span class="fileinput-filename" id="NombreArch"></span>
                                                </div>
                                                <span class="input-group-addon btn btn-secondary btn-file">
                                                    <span class="fileinput-new">Adjuntar</span>
                                                    <span class="fileinput-exists">Change</span>
                                                    <input id="fileupload1" type="file" name="fileupload1"
                                                        (change)="NombreArchivo()">
                                                    <!-- ngFileSelect [options]="options" (onUpload)="handleUpload($event)" -->
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row labelHeder">
                                        <div class="col-6">
                                            Area de negocio
                                        </div>
                                        <div class="col-6">
                                            Centro de costo
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-6">
                                            <select id="drdAreaNegocio"
                                                class="dropdown-toggle select2-chosen-2 form-control requiered"
                                                [(ngModel)]="cotizacion.areaNegocio" name="drdAreaNegocio"
                                                appSelectValidator (change)="getCentroCosto()">
                                                <option value=0 selected>--- Seleccione una opcion ---
                                                </option>
                                                <option
                                                    *ngFor="let AreaNegocio of AreasNegocios$ | async; let i = index"
                                                    value={{AreaNegocio.idAreaNegocio}}>
                                                    {{AreaNegocio.nombreAreaNegocio}}</option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <select id="drdCentroCosto"
                                                class="dropdown-toggle select2-chosen-2 form-control requiered"
                                                [(ngModel)]="cotizacion.centroCosto" name="drdCentroCosto"
                                                appSelectValidator>
                                                <option value=0 selected>--- Seleccione una opcion ---
                                                </option>
                                                <option
                                                    *ngFor="let centroCosto of centrosCostos$ | async; let i = index"
                                                    value={{centroCosto.idCentroCosto}}>
                                                    {{centroCosto.nombreCentroCosto}}</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row labelHeder">
                                        <div class="col-6">
                                            Observaciones
                                            <span class="opcional"></span>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-12">
                                            <textarea class="form-control" name="txtObservacion" rows="3"
                                                name="txtObservacion" [(ngModel)]="cotizacion.observacion"></textarea>
                                        </div>
                                    </div>
                                    <!-- {{cotizacion | json}} -->
                                    <div class="flex">
                                        <button class="btn btn-primary"
                                            [disabled]="!CForm.valid || !cotizacion.nombreAdjunto"
                                            (click)="guardar()">Guardar</button>
                                        <button class="btn btn-secondary" (click)="limpiar()">Limpiar</button>
                                    </div>

                                </fieldset>
                            </form>
                        </div>



                    </section>
                </div>
            </div>

        </div>
    </div>
</div>

<app-correcto [text]="mensaje.ok" *ngIf="mensaje.ok" (cerrarEvent)="cerrarCorrecto()"></app-correcto>
