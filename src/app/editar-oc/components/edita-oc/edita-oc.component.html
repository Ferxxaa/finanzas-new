<div class="row">

    <div class="col-lg-12">
        <section class="widget">
            <header style="background-color: #555555">
                <h4 style="color: white;">
                    <strong>Ordenes rechazadas</strong>
                </h4>
                <div class="acciones">
                    <i class="fa fa-search" (click)="buscador = !buscador"></i>
                </div>
            </header>

            <div class="widget-body">
                <fieldset>

                    <buscador [vista]="false" *ngIf="buscador" (event)="Filtrar($event)"></buscador>
                    <legend></legend>

                    <div class="col-lg-12">
                        <div class="margin05">
                            <div class="row">
                                <div class="col-12">
                                    <table class="table table-bordered table-striped table-hover no-footer mb1">
                                        <thead>
                                            <tr>
                                                <td>Numero OC</td>
                                                <td>Proveedor</td>
                                                <td>Motivo</td>
                                                <td>Descripción</td>
                                                <td>Centro Costo</td>
                                                <td>Monto</td>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr *ngFor="let orden of rechazados | async; let i = index" class="click" (click)="Editar(orden)">
                                                <td>{{orden.folio}}</td>
                                                <td>{{orden.proveedor.nombre}}</td>
                                                <td>{{orden.motivoRechazo}}</td>
                                                <td>{{orden.descripcion}}</td>
                                                    <td [style.color]="orden.centroCosto.letras" [style.background-color]="orden.centroCosto.fondo" class="center">{{orden.centroCosto.nombreCentroCosto}}</td>
                                                <td>$ {{orden.total | number : '1.0-0' | comatopoint }}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>

        </section>
    </div>

</div>
