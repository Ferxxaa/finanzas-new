<div class="bkPopUp" *ngIf="eCentroCosto">
    <div class="popUp">
        <div class="titlePopUp">
            Editar centro de costo
        </div>

        <div class="row labelHeder">
            <div class="col-12">
                Centro de costo
            </div>
        </div>
        <div class="row">
            <div class="col-10">
                <input class="form-control" type="text" placeholder="Centro de costo" name="txtNombre" [(ngModel)]="eCentroCosto.nombre">
            </div>
            <div class="col-2">
                <input id="chkECentroEstado" name="chkECentroEstado" type="checkbox" checked class="custom-control-input" [(ngModel)]="eCentroCosto.activo">
                <label class="custom-control-label" for="chkECentroEstado">Activo</label>
            </div>
        </div>
        <div class="row labelHeder">
            <div class="col-12">
                Sub centro de costo
            </div>
        </div>
        <div class="row">
            <div class="col-10">
                <input class="form-control" type="text" placeholder="Sub centro de costo" name="txtSubccNombre" [(ngModel)]="eSubCentroCostoDatos.nombre">
            </div>
            <div class="col-2">
                <input id="chkESubCentroEstado" name="chkESubCentroEstado" type="checkbox" checked class="custom-control-input" [(ngModel)]="eSubCentroCostoDatos.activo">
                <label class="custom-control-label" for="chkESubCentroEstado">Activo</label>
            </div>
        </div>
        <div class="row labelHeder">
            <div class="col-12">
                Color de fondo
                <span class="opcional"></span>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <input class="form-control" type="color" name="txtColorFondo" [(ngModel)]="eSubCentroCostoDatos.fondo">
            </div>
        </div>
        <div class="row labelHeder">
            <div class="col-12">
                Color de letras
                <span class="opcional"></span>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <input class="form-control" type="color" name="txtColorLetras" [(ngModel)]="eSubCentroCostoDatos.letras">
            </div>
        </div>
        <div class="row labelHeder">
            <div class="col-12">
                Responsable
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <select id="drdResponsable" class="dropdown-toggle select2-chosen-2 form-control requiered" [(ngModel)]="eSubCentroCostoDatos.solicita" name="drdResponsable" appSelectValidator>
                <option value=0 selected>--- Seleccione una opcion ---
                </option>
                <option *ngFor="let user of usuarios; let i=index" [value]="user.nombre + ' ' + user.paterno">{{user.nombre}} {{user.paterno}}</option>
            </select>
            </div>
        </div>
        <div class="row labelHeder">
            <div class="col-12">
                Cliente
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <mat-form-field>
                    <mat-label>Cliente</mat-label>
                    <mat-select placeholder="Cliente" name="drdClienteEdit" [(ngModel)]="cliente" (change)="cambiaCliente(cliente)">
                        <mat-option>--- Seleccione una opcion ---</mat-option>
                        <mat-option *ngFor="let cliente of mandantes$ | async" [value]="cliente.IdMandante">
                            {{ cliente.NombreMandante }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                Costo proyectado
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <input class="form-control" type="number" name="txtMonto" [(ngModel)]="eSubCentroCostoDatos.montoProgramado">
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                Monto de cotrato
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <input class="form-control" type="number" placeholder="Costo de contrato" name="txtContrato" [(ngModel)]="eSubCentroCostoDatos.contrato[0].monto">
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                Periodo
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <input class="form-control" type="number" placeholder="Costo de contrato" name="txtPeriodo" [(ngModel)]="eSubCentroCostoDatos.periodo">
            </div>
        </div>

        <div class="flex">
            <button class="btn btn-primary" (click)="Actualizar()">Actualizar</button>
            <button class="btn btn-secondary" (click)="cerrar()">Cerrar</button>
            <!-- <button class="btn btn-danger" (dblclick)="Eliminar()">Eliminar</button> -->
        </div>

    </div>
</div>
