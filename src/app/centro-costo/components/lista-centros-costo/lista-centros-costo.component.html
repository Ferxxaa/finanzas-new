<div class="row">
  <div class="col-lg-12">
    <section class="widget">
      <header style="background-color: #555555">
        <h2 style="color: white;">
          <strong>Mis centros de costo</strong>
        </h2>
      </header>

      <div class="widget-body">
        <fieldset>
          <legend></legend>

          <div class="row">
            <div class="col-12 text-right" style="margin-bottom: 15px;" *ngIf="gerenteAdmin">
              <button class="btn" [ngClass]="mostrandoDesactivados ? 'btn-secondary' : 'btn-outline-secondary'"
                (click)="cambiarVistaDesactivados()">
                {{ mostrandoDesactivados ? 'Ver activos' : 'Historicos' }}
              </button>
            </div>
            <div class="col-12">
              <table class="table table-bordered table-striped table-hover no-footer">
                <thead>
                  <tr>
                    <td>Area de negocio</td>
                    <td class="text-center">Centro de costo</td>
                    <td>Acciones</td>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    *ngFor="let centroCosto of centrosCosto$ | async | paginate: { itemsPerPage: 10, currentPage: p }; let iPadre = index">
                    <td class="align-middle" (click)="popUp(centroCosto)">{{centroCosto.areaNegocio.nombreAreaNegocio}}
                    </td>
                    <td class="align-middle text-center pointer" (click)="popUp(centroCosto)"
                      [ngStyle]="{'background-color':centroCosto.fondo, 'color':centroCosto.letras}">
                      {{centroCosto.nombreCentroCosto}}
                    </td>
                    <td class="acciones">
                      <button mat-raised-button color="primary" matTooltip="Editar" [matTooltipPosition]="'above'"
                        (click)="popUp(centroCosto)">
                        <i class="fa fa-pencil"></i>
                      </button>
                      <button *ngIf="!mostrandoDesactivados" mat-raised-button color="primary" matTooltip="Bolsas" [matTooltipPosition]="'above'"
                        (click)="configurarBolsas(centroCosto)">
                        <i class="fa fa-gears"></i>
                      </button>
                      <button *ngIf="!mostrandoDesactivados" mat-raised-button color="primary" matTooltip="Ingresos" [matTooltipPosition]="'above'"
                        (click)="configurarIngresos(centroCosto)">
                        <i class="fa fa-money"></i>
                      </button>
                      <button *ngIf="!mostrandoDesactivados" mat-raised-button color="primary" matTooltip="Contratos" [matTooltipPosition]="'above'"
                        (click)="configurarContratos(centroCosto)">
                        <i class="fa fa-plus-circle"></i>
                      </button>
                      <button *ngIf="!mostrandoDesactivados" mat-raised-button color="primary" matTooltip="Garantias" [matTooltipPosition]="'above'"
                        (click)="garantiaCentroCostos(centroCosto)">
                        <i class="fa fa-usd"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <pagination-controls (pageChange)="p = $event"></pagination-controls>
            </div>
          </div>

        </fieldset>
      </div>
    </section>
  </div>
</div>

<app-edit-centro-costo-nest [eCentroCosto]="eCentroCosto" [canReactivate]="gerenteAdmin" *ngIf="eCentroCosto"
  (eCerrar)="eCentroCosto=null" (eUpdate)="update()"></app-edit-centro-costo-nest>
