<app-pop-up-login-fixed *ngIf="loading"></app-pop-up-login-fixed>
<div class="bkPopUp">
  <div class="popUp">
    <div id="popUp">

      <form action="">
        <div class="row">
          <!-- <div class="col-6">Centro de costo</div> -->
          <div class="col-6">Monto</div>
          <div class="col-6">Descripción</div>
        </div>
        <div class="row">
          <!-- <div class="col-6">
            <mat-form-field>
              <mat-label>Centro de Costo</mat-label>
              <mat-select placeholder="Centro de Costo" name="drdCentroCosto" [(ngModel)]="centroCostoId"
                (change)="selectCentroCosto(centroCostoId)">
                <mat-option>--- Seleccione una opcion ---</mat-option>
                <mat-option *ngFor="let centroCosto of centroCosto$ | async | subCentroCosto"
                  [value]="centroCosto.nombre">
                  {{ centroCosto.nombre }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div> -->
          <div class="col-6">
            <mat-form-field>
              <mat-label>Monto</mat-label>
              <input matInput placeholder="Monto agregar" min=0 name="txtMonto" type="number"
                [(ngModel)]="cajaChica.monto">
            </mat-form-field>
          </div>
          <div class="col-6">
            <mat-form-field>
              <mat-label>Descripción</mat-label>
              <textarea matInput placeholder="Descripción" name="txtDescripción"
                [(ngModel)]="cajaChica.descripcion"></textarea>
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-6">Adjuntar</div>
          <!-- <div class="col-6">Descripción</div> -->
        </div>
        <div class="row">
          <div class="col-6">
            <div class="fileinput fileinput-new input-group" data-provides="fileinput">
              <div class="form-control" data-trigger="fileinput">
                <i class="glyphicon glyphicon-file fileinput-exists"></i>
                <span class="fileinput-filename" id="NombreArch"></span>
              </div>
              <span class="input-group-addon btn btn-secondary btn-file">
                <span class="fileinput-new">Adjuntar</span>
                <input id="fileupload1" type="file" name="fileupload1" (change)="NombreArchivo()">
              </span>
            </div>
          </div>
          <!-- <div class="col-6">
            <mat-form-field>
              <mat-label>Descripción</mat-label>
              <textarea matInput placeholder="Descripción" name="txtDescripción"
                [(ngModel)]="cajaChica.descripcion"></textarea>
            </mat-form-field>
          </div> -->
        </div>
        {{cajaChica | json}}
        <section class="acctiones">
          <div class="row">
            <div class="col-6 text-right">
              <button mat-raised-button color="primary" (click)="guardar()">Rendición</button>
            </div>
            <div class="col-6">
              <button mat-raised-button (click)="cerrar()">Salir</button>
            </div>
          </div>
        </section>
      </form>

    </div>
  </div>
</div>
