<div class="user-nav">
    <ul class="user-nav-list">
        <li class="dropdown nav-item">
            <a href="#" class="dropdown-toggle dropdown-toggle-notifications nav-link" id="notifications-dropdown-toggle" data-toggle="dropdown">
                <span class="thumb-sm avatar pull-xs-left">
                    <img class="img-circle" src="http://trazas-nbi.com/Imagenes/TimbreN.jpg" alt="Trazas">
                </span>
                <span class="usuario">{{usuario.nombreUsuario}}</span>
                <b class="caret"></b></a>
            <!-- ready to use notifications dropdown.  inspired by smartadmin template.
         consists of three components:
         notifications, messages, progress. leave or add what's important for you.
         uses Sing's ajax-load plugin for async content loading. See #load-notifications-btn -->
            <div class="dropdown-menu dropdown-menu-right animated fadeInUp user-dropdown-menu" id="user-dropdown-menu">
                <section class="card notifications">
                    <header class="card-header">
                        <div class="text-xs-center mb-sm">
                            <strong>Datos de Usuario</strong>
                        </div>
                    </header>
                    <div class="list-group">
                        <div class="list-group-item user-data-item">
                            <div class="user-data-label">Usuario</div>
                            <div class="user-data-value">{{usuario.nombreUsuario}}</div>
                        </div>

                        <div class="list-group-item user-data-item">
                            <div class="user-data-label">Rol</div>
                            <div class="user-data-value">{{rolUsuario}}</div>
                        </div>

                        <footer class="card-footer text-sm">
                            <a class="btn btn-danger" (click)="CerrarSesion()"><i class="fa fa-sign-out"></i> Cerrar Sesión</a>
                        </footer>
                    </div>
                </section>
            </div>
        </li>
    </ul>
</div>
