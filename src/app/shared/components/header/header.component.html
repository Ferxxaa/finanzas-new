<div class="container-fluid">
    <!-- .navbar-header contains links seen on xs & sm screens -->
    <div class="navbar-header">
        <ul class="nav navbar-nav">
            <li class="nav-item">
                <!-- whether to automatically collapse sidebar on mouseleave. If activated acts more like usual admin templates -->
                <a class="hidden-md-down nav-link" id="nav-state-toggle" data-toggle="tooltip" data-html="true" data-original-title="Turn<br>on/off<br>sidebar<br>collapsing" data-placement="bottom">
                    <i class="fa fa-bars fa-lg"></i>
                </a>
                <!-- shown on xs & sm screen. collapses and expands navigation -->
                <a class="hidden-lg-up nav-link" id="nav-collapse-toggle" data-html="true" title="Show/hide<br>sidebar" data-placement="bottom">
                    <span class="rounded rounded-lg bg-gray text-white hidden-md-up"><i class="fa fa-bars fa-lg"></i></span>
                    <i class="fa fa-bars fa-lg hidden-sm-down"></i>
                </a>
            </li>
            <li class="nav-item hidden-sm-down"><a class="nav-link"><i class="fa fa-refresh fa-lg"></i></a></li>
        </ul>
        <ul class="nav navbar-nav navbar-right hidden-md-up">
            <li>
                <!-- toggles chat -->
                <a href="#" data-toggle="chat-sidebar">
                    <span class="rounded rounded-lg bg-gray text-white"><i class="fa fa-globe fa-lg"></i></span>
                </a>
            </li>
        </ul>
        <!-- xs & sm screen logo -->
        <a class="navbar-brand hidden-md-up" href="#">&nbsp;
            NBI
            &nbsp;
        </a>
        
    </div>

    <div class="header-right">
        <div class="dropdown bell-wrapper">
            <a href="#" class="dropdown-toggle nav-link" id="bell-dropdown-toggle" data-toggle="dropdown" (click)="onBellClick($event)">
                <i class="fa fa-bell fa-lg"></i>
                <span *ngIf="unreadCount > 0" class="badge badge-pill badge-danger bell-badge">
                    {{unreadCount}}
                </span>
            </a>
            <div class="dropdown-menu dropdown-menu-right animated fadeInUp" id="bell-dropdown-menu">
                <div class="notifications-dropdown">
                    <div class="notifications-header-dropdown">
                        <h4>Notificaciones</h4>
                        <div class="notifications-actions">
                            <button class="btn btn-sm" [ngClass]="{'active': viewMode === 'new'}" title="Ver nuevas" (click)="setViewMode('new', $event)">
                                Nuevas
                            </button>
                            <button class="btn btn-sm" [ngClass]="{'active': viewMode === 'all'}" title="Ver todas" (click)="setViewMode('all', $event)">
                                Todas
                            </button>
                            <button class="btn-icon" title="Actualizar" (click)="refreshNow($event)">
                                <i class="fa" [ngClass]="{'fa-refresh': !isRefreshing, 'fa-spinner fa-spin': isRefreshing}"></i>
                            </button>
                            <button class="btn-icon" title="Marcar todas como leídas" (click)="markAllAsRead($event)" [disabled]="unreadCount === 0">
                                <i class="fa fa-check"></i>
                            </button>
                            <button class="btn-icon" title="Cerrar" (click)="closeNotificationsDropdown($event)">
                                <i class="fa fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <div class="notifications-list" [ngClass]="{'is-empty': notifications.length === 0}">
                        <a
                            *ngFor="let n of notifications"
                            href="#"
                            class="notification-item"
                            (click)="openNotification(n, $event)"
                        >
                            <div class="notification-avatar">
                                <i
                                    class="fa"
                                    [ngClass]="{
                                        'fa-file-text-o': n.link === '/Cotizaciones',
                                        'fa-check-square-o': n.link === '/Aprobacion',
                                        'fa-times-circle-o': n.link === '/EditaOC',
                                        'fa-check-circle-o': n.link === '/Ordenes',
                                        'fa-bell-o': n.link !== '/Cotizaciones' && n.link !== '/Aprobacion' && n.link !== '/EditaOC' && n.link !== '/Ordenes'
                                    }"
                                    [style.color]="n.link === '/Cotizaciones' ? '#2b7bbb' : (n.link === '/Aprobacion' ? '#1f7a3a' : (n.link === '/EditaOC' ? '#dc3545' : (n.link === '/Ordenes' ? '#28a745' : '#6c757d')))"
                                ></i>
                            </div>

                            <div class="notification-content">
                                <div class="notification-title">{{n.title}}</div>
                                <div class="notification-description">{{n.body}}</div>
                                <div class="notification-dates">
                                    <div class="notification-created">
                                        <i class="fa fa-clock-o"></i>
                                        <span>{{n.createdAtText ? n.createdAtText : (n.createdAt ? (n.createdAt | date:'dd/MM/yyyy HH:mm') : '--')}}</span>
                                    </div>
                                    <div class="notification-origin" *ngIf="n.link === '/Cotizaciones'">
                                        <i class="fa fa-tag"></i>
                                        <span>Cotizaciones</span>
                                    </div>
                                    <div class="notification-origin" *ngIf="n.link === '/Aprobacion'">
                                        <i class="fa fa-tag"></i>
                                        <span>Aprobación OC</span>
                                    </div>
                                    <div class="notification-origin" *ngIf="n.link === '/EditaOC'">
                                        <i class="fa fa-tag"></i>
                                        <span>OC Rechazada</span>
                                    </div>
                                    <div class="notification-origin" *ngIf="n.link === '/Ordenes'">
                                        <i class="fa fa-tag"></i>
                                        <span>OC Aprobada</span>
                                    </div>
                                </div>
                            </div>

                            <div class="notification-status">
                                <div
                                    class="priority-indicator"
                                    [attr.title]="n.priorityLabel ? ('Prioridad: ' + n.priorityLabel) : 'Prioridad: -'"
                                    [ngClass]="{
                                        'priority-low': n.priority === 1,
                                        'priority-med': n.priority === 2,
                                        'priority-high': n.priority === 3
                                    }"
                                ></div>
                            </div>
                        </a>

                        <div *ngIf="notifications.length === 0" class="notification-empty">
                            <div class="notification-empty-icon"><i class="fa fa-bell-slash-o"></i></div>
                            <div class="notification-empty-title">Sin notificaciones</div>
                            <div class="notification-empty-subtitle">Cuando haya pendientes, aparecerán aquí.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <app-user></app-user>
    </div>
  </div>
