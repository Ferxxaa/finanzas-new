<div class="bkPopUpFF" *ngIf="fijarFlujoService.monto">
  <div class="popUpFF" (click)="prevProg($event)">
    <div id="popUpFF">
      <div class="row">
        <div class="col-12 bold title">
          INGRESE EL VALOR FINAL DEL ESTADO DE PAGO
          <br>
        </div>
      </div>
      <div class="row editor">
        <div class="col-12">
          <mat-form-field>
            <input matInput placeholder="Monto a pagar" [(ngModel)]="fijarFlujoService.monto">
          </mat-form-field>
        </div>
      </div>

      <div id="Acciones" class="flex Fcenter">
        <button class="btn btn-primary" (click)="asignar()">Asignar</button>
      </div>
    </div>
  </div>
</div>
