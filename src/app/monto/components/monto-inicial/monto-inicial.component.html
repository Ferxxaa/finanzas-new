<div class="row">

    <div class="col-lg-12">
        <section class="widget Max">
            <header style="background-color: #555555">
                <h4 style="color: white;">
                    <strong> Crear cuentas de banco</strong>
                </h4>
            </header>

            <div class="widget-body">
                <fieldset>
                    <legend></legend>

                    <div class="col-lg-12">
                        <div class="margin05">
                            <div class="row">
                                <div class="col-6">
                                    Monto inicial
                                </div>
                                <div class="col-6">
                                    Sobregiro de pagos
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <input class="form-control" type="text" placeholder="Monto inicial" name="txtMonto" required [(ngModel)]="monto.partida"> ${{monto.partida | number : '1.0-0' | comatopoint}}
                                </div>
                                <div class="col-6">
                                    <input class="form-control" type="text" placeholder="Sobregiro" name="txtSobregiro" required [(ngModel)]="monto.sobregiro"> ${{monto.sobregiro | number : '1.0-0' | comatopoint}}
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    IVA
                                </div>
                                <div class="col-6">
                                    Boletas
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <input class="form-control" type="number" placeholder="IVA" name="txtIVA" required [(ngModel)]="monto.iva"> {{monto.iva | number : '1.0-0' | comatopoint}}%
                                </div>
                                <div class="col-6">
                                    <input class="form-control" type="number" placeholder="Boleta" name="txtBoleta" required [(ngModel)]="monto.boleta"> {{monto.boleta | number : '1.2-2' | comatopoint}}%
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <button class="btn btn-primary" (click)="guardar()">Guardar</button>
                                    <a class="btn btn-secondary" [routerLink]="['/Cuenta']">Volver</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </section>
    </div>

</div>

<app-correcto [text]="mensaje.ok" *ngIf="mensaje.ok" (cerrarEvent)="cerrarPopUp()"></app-correcto>
