<ng-template #NoData>
  <app-pop-up-login-fixed></app-pop-up-login-fixed>
</ng-template>

<div class="bkPopUp" *ngIf="rutProveedor">
  <div class="popUp">
    <div class="titlePopUp">
      Evaluar Proveedor
    </div>
    <div class="Producto">
      <div class="row labelHeder">
        <div class="col-6">
          Disponibilidad
        </div>
        <div class="col-6">
          Variabilidad de precio
        </div>
      </div>
      <div class="row separador">
        <div class="col-5">
          <input type="range" min="0" step="0.1" max="3" value="3" class="slider"
            [ngClass]="{verde:evaluacion.disponibilidad >=2.54,amarillo:evaluacion.disponibilidad <=2.53 && evaluacion.disponibilidad >=1.8, rojo:evaluacion.disponibilidad <= 1.7}"
            [(ngModel)]="evaluacion.disponibilidad">
        </div>
        <div class="col-1">
          {{evaluacion.disponibilidad}}
        </div>
        <div class="col-5">
          <input type="range" min="0" step="0.1" max="3" value="3" class="slider"
            [ngClass]="{verde:evaluacion.precio >=2.54,amarillo:evaluacion.precio <=2.53 && evaluacion.precio >=1.8, rojo:evaluacion.precio <= 1.7}"
            [(ngModel)]="evaluacion.precio">
        </div>
        <div class="col-1">
          {{evaluacion.precio}}
        </div>
      </div>


      <div class="row labelHeder">
        <div class="col-6">
          Tiempo de entrega
        </div>
        <div class="col-6">
          Calidad
        </div>
      </div>
      <div class="row separador">
        <div class="col-5">
          <input type="range" min="0" step="0.1" max="3" value="3" class="slider"
            [ngClass]="{verde:evaluacion.tiempo >=2.54,amarillo:evaluacion.tiempo <=2.53 && evaluacion.tiempo >=1.8, rojo:evaluacion.tiempo <= 1.7}"
            [(ngModel)]="evaluacion.tiempo">
        </div>
        <div class="col-1">
          {{evaluacion.tiempo}}
        </div>
        <div class="col-5">
          <input type="range" min="0" step="0.1" max="3" value="3" class="slider"
            [ngClass]="{verde:evaluacion.calidad >=2.54,amarillo:evaluacion.calidad <=2.53 && evaluacion.calidad >=1.8, rojo:evaluacion.calidad <= 1.7}"
            [(ngModel)]="evaluacion.calidad">
        </div>
        <div class="col-1">
          {{evaluacion.calidad}}
        </div>
      </div>
    </div>

    <div class="row labelHeder">
      <div class="col-6">
        SSO - MA
      </div>
    </div>
    <div class="row separador">
      <div class="col-5">
        <input type="range" min="0" step="0.1" max="3" value="3" class="slider"
          [ngClass]="{verde:evaluacion.ssoma >=2.54,amarillo:evaluacion.ssoma <=2.53 && evaluacion.ssoma >=1.8, rojo:evaluacion.ssoma <= 1.7}"
          [(ngModel)]="evaluacion.ssoma">
      </div>
      <div class="col-1">
        {{evaluacion.ssoma}}
      </div>
    </div>
    <div class="row labelHeder">
      <div class="col-6">
        Comentario
      </div>
      <div class="col-6">Evaluaciones pendientes de evaluacion</div>
    </div>
    <div class="row separador">
      <div class="col-6">
        <textarea name="txtObservacion" rows="15" [(ngModel)]="evaluacion.Comentario"></textarea>
      </div>
      <div class="col-6" *ngIf="movimientos$ | async as movimientos else NoData">
        <ul *ngIf="movimientos$ | async as movimientos else NoData">
          <li *ngFor="let movimiento of movimientos; let i = index" (click)="selectItem($event,movimiento)">
            <div class="ulflex">
              <div>{{movimiento.folio}}</div>
            </div>
          </li>
        </ul>
        <!-- <mat-list-option *ngFor="let movimiento of movimientos; let i = index">{{shoe}}</mat-list-option> -->
      </div>
    </div>
    <!-- <div class="row labelHeder">
      <div class="col-12">Evaluaciones pendientes de evaluacion</div>
    </div>
    <div class="row">
      <div class="col-12" *ngIf="movimientos$ | async as movimientos else NoData">
        <ul *ngIf="movimientos$ | async as movimientos else NoData">
          <li *ngFor="let movimiento of movimientos; let i = index" (click)="selectItem($event,movimiento)">
            <div class="ulflex">
              <div>{{movimiento.folio}}</div>
            </div>
          </li>
        </ul>
      </div> 
    </div>-->
    <div class="flex">
      <button class="btn btn-primary" (click)="Actualizar()">Evaluar</button>
      <button class="btn btn-secondary" (click)="limpiar()">Cerrar</button>
    </div>
  </div>
</div>
