<div class="row">
    <div class="col-lg-12">
        <section class="widget Max">
            <header style="background-color: #555555">
                <h4 style="color: white;">
                    <strong>Resumen de Proveedores Evaluados</strong>
                </h4>
            </header>

            <div class="widget-body">
                <fieldset>
                    <legend></legend>
                    <div class="row grafico-proveedor-layout">
                        <div class="col-5">
                            <div class="grafico-proveedor-colores">
                                <app-colores-evaluacion></app-colores-evaluacion>
                            </div>
                        </div>
                        <div class="col-7"></div>
                    </div>
                    <div class="row grafico-proveedor-layout">
                        <div class="col-5 grafico-proveedor-left">
                            <app-resumen [data]='data'></app-resumen>
                        </div>
                        <div class="col-7 grafico-proveedor-right">
                            <app-grafico [data]='data'></app-grafico>
                        </div>
                    </div>
                    <div class="row grafico-proveedor-reportes" *ngIf="reportEvalProv">
    <div class="col-lg-12">
        <app-resumen-anual [agno]="agno" [reportEvalProv]="reportEvalProv" [inline]="true"></app-resumen-anual>
        <app-proveedores-estrategicos [agno]="agno" [reportEvalProv]="reportEvalProv" [inline]="true"></app-proveedores-estrategicos>
    </div>
</div>
                </fieldset>

            </div>
        </section>
    </div>
</div>

<app-loading *ngIf="loading"></app-loading>
